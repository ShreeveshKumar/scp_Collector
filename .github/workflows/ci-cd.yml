name: Startup Intelligence CI/CD

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '*/35 * * * *'   # fires at :00 and :35 each hour (cron's closest to every-35-min)
  workflow_dispatch:

jobs:
  run-job:
    runs-on: ubuntu-22.04
    environment: production
    env:
      # ── MongoDB ────────────────────────────────────────────────────────────
      # Simplest: set MONGODB_URI (a full Atlas string) and ignore the parts.
      # Otherwise provide the components and a URI is assembled by the app.
      MONGODB_URI: ${{ secrets.MONGODB_URI }}   # optional — overrides the parts below
      MONGODB_SCHEME: ${{ secrets.MONGODB_SCHEME || 'mongodb+srv' }}
      MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      MONGODB_HOST: ${{ secrets.MONGODB_HOST }}
      MONGODB_OPTIONS: ${{ secrets.MONGODB_OPTIONS || 'retryWrites=true&w=majority' }}
      MONGODB_DATABASE: ${{ vars.MONGODB_DATABASE || 'startup_intel' }}
      MONGODB_COLLECTION: ${{ vars.MONGODB_COLLECTION || 'startups' }}

      # ── Source + HTTP tuning (safe defaults; override via repo secrets/vars) ─
      SIA_HN_TAGS: ${{ vars.SIA_HN_TAGS || 'show_hn' }}
      SIA_HN_HITS: ${{ vars.SIA_HN_HITS || '50' }}
      SIA_HTTP_USER_AGENT: ${{ secrets.SIA_HTTP_USER_AGENT || 'startup-intel-agent/1.0 (+https://github.com)' }}
      SIA_HTTP_TIMEOUT_MS: ${{ vars.SIA_HTTP_TIMEOUT_MS || '15000' }}
      SIA_ENABLE_TECH_DETECTION: ${{ vars.SIA_ENABLE_TECH_DETECTION || 'true' }}
      SIA_LOG_LEVEL: ${{ vars.SIA_LOG_LEVEL || 'info' }}

      # Version of the MongoDB C++ driver we build from source (Ubuntu does not
      # package it — only the C driver). r3.11+ auto-downloads the C driver.
      MONGOCXX_VERSION: r3.11.0

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates pkg-config cppcheck \
            libssl-dev libsasl2-dev zlib1g-dev \
            libcurl4-openssl-dev nlohmann-json3-dev

      # The C++ driver is not in any Ubuntu repo, so we build it from source and
      # cache the install — it only rebuilds when MONGOCXX_VERSION changes.
      - name: Cache MongoDB C++ driver
        id: cache-mongocxx
        uses: actions/cache@v4
        with:
          path: ~/mongocxx
          key: mongocxx-${{ env.MONGOCXX_VERSION }}-ubuntu22.04

      - name: Build MongoDB C++ driver from source
        if: steps.cache-mongocxx.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$MONGOCXX_VERSION" \
            https://github.com/mongodb/mongo-cxx-driver.git /tmp/mongo-cxx-driver
          cmake -S /tmp/mongo-cxx-driver -B /tmp/mongo-cxx-driver/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/mongocxx" \
            -DMONGOCXX_OVERRIDE_DEFAULT_INSTALL_PREFIX=OFF \
            -DENABLE_TESTS=OFF
          cmake --build /tmp/mongo-cxx-driver/build --parallel
          cmake --install /tmp/mongo-cxx-driver/build

      - name: Export driver paths
        run: |
          echo "CMAKE_PREFIX_PATH=$HOME/mongocxx" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/mongocxx/lib:$HOME/mongocxx/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Lint with cppcheck
        run: |
          # Strict pass — fail the build on genuine errors only.
          cppcheck --error-exitcode=1 --std=c++20 --language=c++ \
            --suppress=missingInclude --suppress=missingIncludeSystem \
            -I include src
          # Informational pass — never fails the build (mirrors flake8 --exit-zero).
          cppcheck --enable=all --inconclusive --std=c++20 --language=c++ \
            --suppress=missingInclude --suppress=missingIncludeSystem \
            -I include src || true

      - name: Configure & build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/mongocxx"
          cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Run startup intelligence collector
        run: |
          if [ -z "$MONGODB_URI" ] && [ -z "$MONGODB_USERNAME" ] && [ -z "$MONGODB_HOST" ]; then
            echo "::warning::No MongoDB config (set MONGODB_URI or the MONGODB_* parts as secrets); skipping run."
            exit 0
          fi
          ./build/sia --once
