name: Scheduled discovery (every 35 min)

# Runs a discovery pass on a schedule against your MongoDB.
# NOTE: cron cannot express a true "every 35 minutes" (it resets each hour),
# so this fires at :00 and :35 of every hour. For an exact 35-minute interval
# use the internal scheduler (`sia --interval 2100`) or the systemd timer.
# Requires repository secret MONGODB_URI. Optional repo variables
# MONGODB_DATABASE / MONGODB_COLLECTION override the defaults.

on:
  schedule:
    - cron: "*/35 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Guard on secret
        run: |
          if [ -z "${{ secrets.MONGODB_URI }}" ]; then
            echo "MONGODB_URI secret not set; skipping run."
            exit 0
          fi

      - name: Pull image
        run: docker pull ghcr.io/${{ github.repository }}:latest

      - name: Run one discovery pass
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          docker run --rm -e MONGODB_URI \
            -e MONGODB_DATABASE="${{ vars.MONGODB_DATABASE || 'startup_intel' }}" \
            -e MONGODB_COLLECTION="${{ vars.MONGODB_COLLECTION || 'startups' }}" \
            ghcr.io/${{ github.repository }}:latest --once
