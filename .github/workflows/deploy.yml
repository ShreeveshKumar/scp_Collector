name: Deploy

# Auto-deploy on every push to main (and on version tags):
#   1. build the Docker image and push it to GHCR
#   2. run one discovery pass against your MongoDB so the deploy is live now
#
# Setup (one time): add repository secret MONGODB_URI (your Atlas/self-hosted
# connection string). The ongoing (every-35-min) cadence is in scheduled.yml.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: Build & push image (GHCR)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  run-once:
    name: Run one discovery pass (live)
    needs: build-push
    runs-on: ubuntu-24.04
    steps:
      - name: Discovery pass against MongoDB
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::warning::MONGODB_URI secret not set — image pushed but no run performed."
            exit 0
          fi
          docker run --rm -e MONGODB_URI \
            -e MONGODB_DATABASE="${{ vars.MONGODB_DATABASE || 'startup_intel' }}" \
            -e MONGODB_COLLECTION="${{ vars.MONGODB_COLLECTION || 'startups' }}" \
            ghcr.io/${{ github.repository }}:latest --once
